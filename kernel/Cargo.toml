cargo-features = ["per-package-target"]

[package]
name = "evkrnl"
version = "0.1.0"
edition = "2024"
forced-target = "x86_64-unknown-none"

[dependencies]
acpi = { version = "6.1.1", default-features = false }
atomic_enum = "0.3.0"
bitvec = { version = "1.0.1", default-features = false }
bootloader_api = "0.11.15"
chrono = { version = "0.4.44", default-features = false }
compile-time = "0.2.0"
linked_list_allocator = { version = "0.10.6", default-features = false }
pc-keyboard = "0.9.0"
raw-cpuid = "11.6.0"
spin = "0.10.0"
uart_16550 = "0.4.0"
x86_64 = "0.15.4"

[build-dependencies]
config = { version = "0.15.11", default-features = false, features = ["toml", "json", "yaml", "json5"] }
serde = { version = "1.0.219", features = ["derive"] }
